
services:

  # =========================
  # API GATEWAY
  # =========================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - product-service
      - inventory-service
      - purchase-service
      - sale-service
      - notification-service
    networks:
      - inventory-net

  # =========================
  # PRODUCT SERVICE
  # =========================
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PRODUCT_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - inventory-net

  # =========================
  # INVENTORY SERVICE
  # =========================
  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: inventory-service
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${INVENTORY_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - inventory-net

  # =========================
  # PURCHASE SERVICE
  # =========================
  purchase-service:
    build:
      context: .
      dockerfile: services/purchase-service/Dockerfile
    container_name: purchase-service
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${PURCHASE_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      AWS_ENDPOINT_URL_SQS: ${AWS_ENDPOINT_URL}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - inventory-net

  # =========================
  # SALE SERVICE
  # =========================
  sale-service:
    build:
      context: .
      dockerfile: services/sale-service/Dockerfile
    container_name: sale-service
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${SALE_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - inventory-net

  # =========================
  # NOTIFICATION SERVICE
  # =========================
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${NOTIFICATION_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - inventory-net

  # =========================
  # POSTGRESQL
  # =========================
  postgres:
    image: postgres:18
    container_name: inventory-postgres
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inventory-net


  # =========================
  # LOCALSTACK
  # =========================
  localstack:
    image: localstack/localstack:3.8
    container_name: localstack
    env_file:
      - .env.docker
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs,sns,dynamodb
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DEBUG: "0"
      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path
    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./infra/localstack:/etc/localstack/init/ready.d"
    networks:
      - inventory-net


  # =========================
  # LOKI
  # =========================
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - inventory-net

  # =========================
  # GRAFANA
  # =========================
  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - inventory-net

  # =========================
  # PROMTAIL
  # =========================
  promtail:
    image: grafana/promtail:3.5.0
    container_name: promtail
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - inventory-net

  # =========================
  # PROMETHEUS
  # =========================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - product-service
      - inventory-service
      - purchase-service
      - sale-service
      - notification-service
    networks:
      - inventory-net

  # =========================
  # JAEGER
  # =========================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - inventory-net

# =========================
# NETWORKS
# =========================
networks:
  inventory-net:
    driver: bridge

# =========================
# VOLUMES
# =========================
volumes:
  localstack_data:
  postgres_data: