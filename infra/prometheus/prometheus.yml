global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "product-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["product-service:8081"]

  - job_name: "inventory-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["inventory-service:8082"]

  - job_name: "purchase-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["purchase-service:8083"]

  - job_name: "sale-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["sale-service:8084"]

  - job_name: "notification-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["notification-service:8085"]